<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Weather app</title>
</head>

<body>
  <div class="navBarContainer">
    <span><img src="./assets/images/logo.svg" alt="logo"></span> <span>

      <div class="units">
        <button>Units</button>
      </div>
    </span>
  </div>

  <div class="searcBarContainer">
    <h1>How's the sky looking today?</h1>
    <search>
      <input type="text" id="searcBar" placeholder="Search for a place">
      <span>
        <button class="search">Search</button>
      </span>
    </search>
  </div>


  <div class="mainContainer">
    <div class="todayCard">
      <div class="placeAndDate">
        <span class="place">Berlin, Germany</span>
        <span class="date">Tuesday, Aug 5, 2025</span>
      </div>
      <div class="currTempAndGraphic">
        <span><img src="./assets/images/icon-sunny.webp" alt="sunny"></span>
        <span class="currTemp">20°</span>
      </div>
    </div>
  </div>
</body>

</html>
